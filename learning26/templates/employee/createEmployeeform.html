{% extends 'base.html' %}
{% block content %}
    <h1>CRETAE EMPLOYEEFORM</h1>

<form method="POST">
    {% csrf_token %}
<div class="form-container">
    <h2>Create Employee</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name">
        </div>

        <div class="form-group">
            <label>Age:</label>
            <input type="number" name="age">
        </div>

        <div class="form-group">
            <label>Salary:</label>
            <input type="number" name="salary">
        </div>

        <div class="form-group">
            <label>Post:</label>
            <input type="text" name="post">
        </div>

        <button type="submit" class="submit-btn">Submit</button>
    </form>

    <a href="{% url 'employeeList' %}" class="back-link">← Back to Employee List</a>
</div>

  
</form>
{% endblock content %}
